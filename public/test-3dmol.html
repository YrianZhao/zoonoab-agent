<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3Dmol Minimal Test</title>
<script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
<style>
body { margin: 20px; background: #fff; font-family: sans-serif; }
.viewer-box { width: 400px; height: 300px; background: #FEF2F2; border: 2px solid #EF4444; position: relative; }
.viewer-box canvas { border: 3px solid #10B981 !important; }
h2 { margin-top: 30px; }
</style>
</head>
<body>
<h1>3Dmol.js Minimal Rendering Test</h1>

<h2>Test 1: Remote PDB from RCSB</h2>
<div id="viewer1" class="viewer-box">Loading...</div>

<h2>Test 2: Local PDB via proxy</h2>
<div id="viewer2" class="viewer-box">Loading...</div>

<h2>Test 3: Inline PDB data</h2>
<div id="viewer3" class="viewer-box">Loading...</div>

<div id="log" style="margin-top:20px; padding:10px; background:#f0f0f0; white-space:pre-wrap; font-size:12px;"></div>

<script>
const log = (msg) => {
    document.getElementById('log').textContent += msg + '\n';
    console.log('[TEST] ' + msg);
};

// Test 1: Remote RCSB PDB
try {
    const v1 = $3Dmol.createViewer(document.getElementById('viewer1'), {
        backgroundColor: '#FFFFFF',
        antialias: true,
    });
    const c1 = document.querySelector('#viewer1 canvas');
    log(`Test1 createViewer OK, canvas: ${c1 ? c1.width+'x'+c1.height : 'NONE'}`);

    $3Dmol.download('pdb:4KC3', v1, {}, function() {
        log('Test1 download callback fired');
        v1.setStyle({}, { cartoon: { color: '#60A5FA' } });
        v1.zoomTo();
        v1.render();
        log(`Test1 rendered, canvas: ${c1.width}x${c1.height}`);
    });
} catch(e) {
    log('Test1 ERROR: ' + e.message);
}

// Test 2: Local PDB via proxy
setTimeout(() => {
    try {
        const container2 = document.getElementById('viewer2');
        container2.innerHTML = '';
        const v2 = $3Dmol.createViewer(container2, {
            backgroundColor: '#FFFFFF',
            antialias: true,
        });
        const c2 = container2.querySelector('canvas');
        log(`Test2 createViewer OK, canvas: ${c2 ? c2.width+'x'+c2.height : 'NONE'}`);

        fetch('/api/pdb/local/4KC3_site1_1655576_binder-0_iptm-0.7953_complex.pdb')
            .then(r => { log('Test2 fetch status: ' + r.status); return r.text(); })
            .then(data => {
                log('Test2 fetched ' + data.length + ' chars');
                const m = v2.addModel(data, 'pdb');
                m.setStyle({}, { cartoon: { color: '#60A5FA' } });
                v2.zoomTo();
                v2.render();
                log(`Test2 rendered, canvas: ${c2.width}x${c2.height}`);
            })
            .catch(err => log('Test2 fetch ERROR: ' + err.message));
    } catch(e) {
        log('Test2 ERROR: ' + e.message);
    }
}, 1000);

// Test 3: Inline minimal PDB
setTimeout(() => {
    try {
        const container3 = document.getElementById('viewer3');
        container3.innerHTML = '';
        const v3 = $3Dmol.createViewer(container3, {
            backgroundColor: '#FFFFFF',
            antialias: true,
        });
        const c3 = container3.querySelector('canvas');
        log(`Test3 createViewer OK, canvas: ${c3 ? c3.width+'x'+c3.height : 'NONE'}`);

        const pdb = `ATOM      1  N   ALA A   1      10.000   0.000   0.000  1.00 50.00           N
ATOM      2  CA  ALA A   1      11.000   0.000   0.000  1.00 50.00           C
ATOM      3  C   ALA A   1      11.500   1.400   0.000  1.00 50.00           C
ATOM      4  O   ALA A   1      11.000   2.300   0.000  1.00 50.00           O
ATOM      5  CB  ALA A   1      11.500  -0.600   1.200  1.00 50.00           C
ATOM      6  N   GLY A   2      12.800   1.400  -0.200  1.00 50.00           N
ATOM      7  CA  GLY A   2      13.600   2.500  -0.200  1.00 50.00           C
ATOM      8  C   GLY A   2      15.000   1.800  -0.200  1.00 50.00           C
ATOM      9  O   GLY A   2      15.600   2.700  -0.200  1.00 50.00           O
ATOM     10  N   VAL A   3      15.500   0.500  -0.200  1.00 50.00           N
ATOM     11  CA  VAL A   3      16.800  -0.200  -0.200  1.00 50.00           C
ATOM     12  C   VAL A   3      18.000   0.700  -0.200  1.00 50.00           C
ATOM     13  O   VAL A   3      18.700   1.600  -0.200  1.00 50.00           O
ATOM     14  CB  VAL A   3      17.300  -1.600   0.800  1.00 50.00           C
ATOM     15  CG1 VAL A   3      18.300  -2.700   0.200  1.00 50.00           C
ATOM     16  CG2 VAL A   3      16.200  -2.500   1.800  1.00 50.00           C
END`;

        const m3 = v3.addModel(pdb, 'pdb');
        m3.setStyle({}, { stick: { radius: 0.2 } });
        v3.zoomTo();
        v3.render();
        log(`Test3 rendered, canvas: ${c3.width}x${c3.height}`);
    } catch(e) {
        log('Test3 ERROR: ' + e.message);
    }
}, 2000);
</script>
</body>
</html>
