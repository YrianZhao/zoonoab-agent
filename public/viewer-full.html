<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full 3D Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0D1117;font-family:-apple-system,sans-serif}
.wrap{display:flex;flex-direction:column;width:100%;height:100%}
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:#161B27;border-bottom:1px solid rgba(255,255,255,0.1);
  flex-shrink:0;flex-wrap:wrap;z-index:5}
.tbg{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:uppercase}
.btns{display:flex;gap:3px}
.btn{padding:4px 13px;border-radius:7px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.65);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#FB923C;color:#FB923C;background:rgba(251,146,60,0.1)}
.btn.active{background:#1D4ED8;color:#fff;border-color:#3B82F6;box-shadow:0 2px 8px rgba(59,130,246,.35)}
.divider{width:1px;height:22px;background:rgba(255,255,255,0.1)}
.actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.act{padding:5px 12px;border-radius:7px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.65);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.act:hover{border-color:#2DD4BF;color:#2DD4BF;background:rgba(45,212,191,0.1)}
.act.active{background:#EF4444;color:#fff;border-color:#EF4444}
.vf-auto-spin-badge{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:8px;border:1px solid rgba(59,130,246,0.45);background:rgba(37,99,235,0.16);color:#60A5FA;font-size:12px;font-weight:800;letter-spacing:.12em;white-space:nowrap;box-shadow:0 0 0 1px rgba(59,130,246,0.08) inset}
.vf-source-badge{display:inline-flex;align-items:center;justify-content:center;height:30px;min-width:58px;padding:0 13px;border-radius:7px;border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:800;letter-spacing:.04em;line-height:1;text-transform:lowercase;white-space:nowrap;pointer-events:none;user-select:none;cursor:default}
.vf-source-badge.local{border-color:rgba(45,212,191,.48);background:rgba(13,148,136,.17);color:#5EEAD4}
.vf-source-badge.auto{border-color:rgba(250,204,21,.38);background:rgba(202,138,4,.13);color:#FDE68A}
.vwrap{flex:1;position:relative;overflow:hidden}
#vc{width:100%;height:100%;position:relative}
canvas{width:100%!important;height:100%!important;display:block;outline:none}
.vf-role-legend{position:absolute;left:14px;bottom:14px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 28px);pointer-events:none}
.vf-role-item{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 10px;border:1px solid rgba(255,255,255,0.14);border-radius:8px;background:rgba(13,17,23,0.78);color:rgba(255,255,255,0.78);font-size:12px;line-height:1.35;backdrop-filter:blur(8px)}
.vf-role-swatch{width:11px;height:11px;border-radius:999px;border:1px solid rgba(255,255,255,0.35);flex:0 0 auto}
.vf-role-item strong{color:#fff;font-weight:800}
.hint{text-align:center;padding:7px 0;color:rgba(255,255,255,0.25);font-size:11px;flex-shrink:0;z-index:5;background:#0D1117;}
.ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
   color:#FB923C;font-size:12px;letter-spacing:.5px;pointer-events:none;white-space:nowrap;z-index:3}
body.compact-viewer .toolbar,body.compact-viewer .hint,body.compact-viewer .vf-role-legend{display:none!important}
body.compact-viewer .vwrap{height:100%;flex-basis:100%}
@media (max-width:600px){
  .toolbar{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start;gap:7px 8px;padding:8px 10px}
  .tbg{line-height:30px}
  .divider{display:none}
  .btns{min-width:0;flex-wrap:wrap;gap:4px}
  .btn{padding:4px 10px}
  .actions{grid-column:2;margin-left:0;min-width:0;flex-wrap:wrap;justify-content:flex-start}
  .act{padding:5px 10px}
  .vf-auto-spin-badge{height:30px;padding:0 12px}
  .vf-source-badge{height:30px;min-width:54px;padding:0 10px}
}
</style>
<body>
<div class="wrap">
  <div class="toolbar">
    <span class="tbg">STYLE</span><div class="btns" id="sBtns"></div>
    <div class="divider"></div>
    <span class="tbg">COLOR</span><div class="btns" id="cBtns"></div>
    <div class="actions" id="acts"></div>
  </div>
  <div class="vwrap"><div id="vc"><div class="ld">Loading...</div></div><div id="roleLegend" class="vf-role-legend"></div></div>
  <div class="hint">Drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan</div>
</div>

<script src="/lib/3Dmol-min.js"></script>
<script>
(function(){
    var params = new URLSearchParams(location.search);
    var pdbUrl = params.get('pdb') || '';
    var AUTO_SPIN = params.get('autoSpin') === '1' || params.get('autoSpin') === 'true';
    var INTERFACE_DETAIL_ENABLED = params.get('interfaceDetail') !== '0';
    var MODEL_ORIGIN = params.get('modelOrigin') === 'local' ? 'local' : 'auto';
    var STRUCTURE_LABELS = ['展示姿态', '实验复合物', '预测抗原结构', '实验抗原结构', '代表性结构', '坐标已载入'];
    var requestedStructureLabel = String(params.get('structureLabel') || '').trim();
    var STRUCTURE_LABEL = STRUCTURE_LABELS.indexOf(requestedStructureLabel) >= 0 ? requestedStructureLabel : '坐标已载入';
    var COMPACT_MODE = params.get('compact') === '1';
    var POSE_SEED = parseInt(params.get('poseSeed') || '0', 10) || 0;
    document.body.classList.toggle('compact-viewer', COMPACT_MODE);

    // ════ Colors ════
    function safeViewerColor(value, fallback) {
        var text = String(value || '').trim();
        return /^#(?:[0-9A-Fa-f]{3}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{8})$/.test(text) ? text : fallback;
    }
    var AG_COLOR = safeViewerColor(params.get('chainA'), '#FB923C');
    var AB_COLOR = safeViewerColor(params.get('chainB'), '#2DD4BF');
    var SF_COLOR = '#67E8F9';   // Surface → cyan
    function escHtmlText(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    function renderRoleLegend() {
        var el = document.getElementById('roleLegend');
        if (!el) return;
        var html =
            '<span class="vf-role-item"><span class="vf-role-swatch" style="background:' + escHtmlText(AG_COLOR) + '"></span><strong>抗原</strong></span>';
        if (AB_CHAINS.length) {
            html += '<span class="vf-role-item"><span class="vf-role-swatch" style="background:' + escHtmlText(AB_COLOR) + '"></span><strong>抗体</strong></span>';
        }
        el.innerHTML = html;
    }
    function renderAutoSpinBadge() {
        if (!AUTO_SPIN) return;
        var actions = document.getElementById('acts');
        if (!actions || document.getElementById('vfAutoSpinBadge')) return;
        var badge = document.createElement('span');
        badge.id = 'vfAutoSpinBadge';
        badge.className = 'vf-auto-spin-badge';
        badge.textContent = '自动旋转';
        var firstAction = actions.querySelector('.act');
        if (firstAction) actions.insertBefore(badge, firstAction);
        else actions.appendChild(badge);
    }
    function renderModelOriginBadge() {
        var actions = document.getElementById('acts');
        if (!actions || document.getElementById('vfModelOriginBadge')) return;
        var badge = document.createElement('span');
        badge.id = 'vfModelOriginBadge';
        badge.className = 'vf-source-badge ' + MODEL_ORIGIN;
        var displayLabel = STRUCTURE_LABEL;
        badge.textContent = displayLabel;
        badge.setAttribute('aria-label', displayLabel);
        actions.appendChild(badge);
    }
    function parseChains(value, fallback, allowExplicitEmpty) {
        if (allowExplicitEmpty && value !== null && String(value).trim() === '') return [];
        var arr = String(value || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
        return arr.length ? arr : fallback;
    }
    var AG_CHAINS = parseChains(params.get('antigenChains'), ['A']);
    var AB_CHAINS = parseChains(params.get('antibodyChains'), ['B'], params.has('antibodyChains'));
    var VISIBLE_CHAINS = AG_CHAINS.concat(AB_CHAINS).filter(function(ch, idx, arr) {
        return ch && arr.indexOf(ch) === idx;
    });
    function selectorForChains(chains) {
        return chains.length === 1 ? {chain: chains[0]} : {or: chains.map(function(ch){ return {chain: ch}; })};
    }
    function visibleSelector() {
        return selectorForChains(VISIBLE_CHAINS.length ? VISIBLE_CHAINS : AG_CHAINS.concat(AB_CHAINS));
    }
    function antibodySelector() {
        return AB_CHAINS.length ? selectorForChains(AB_CHAINS) : null;
    }
    function normalizeStyle(s) {
        s = String(s || 'cartoon').toLowerCase();
        if (s === 'stick') return 'interface';
        return STYLES[s] ? s : 'cartoon';
    }
    function applyByStyle(selector, color) {
        switch(currentStyle){
            case 'cartoon': glv.setStyle(selector, {cartoon:{color: color}}); break;
            case 'interface': glv.setStyle(selector, {cartoon:{color: color}}); break;
            case 'sphere': glv.setStyle(selector, {sphere:{scale:0.35, color: color}}); break;
            case 'line': glv.setStyle(selector, {line:{color: color}}); break;
            case 'cross': glv.setStyle(selector, {cross:{color: color}}); break;
            default: glv.setStyle(selector, {cartoon:{color: color}});
        }
    }

    // ════ STATE (outer scope — all functions can see these) ════
    var glv = null;
    var currentStyle = 'cartoon';
    var currentColor = 'ab-ag';
    var isSpinning = false;
    var _loaded = false;

    // ════ Style defs ════
    var STYLES = {
        cartoon: 'cartoon',
        interface: 'interface',
        sphere:  'sphere',
        line:    'line',
        cross:   'cross',
        surface: 'surface'
    };
    if (!INTERFACE_DETAIL_ENABLED) delete STYLES.interface;

    // ════ Color scheme implementations ════
    //
    // CRITICAL: For cartoon style, you CANNOT do separate setStyle calls like:
    //   glv.setStyle({}, {cartoon:{}})
    //   glv.setStyle({chain:'A'}, {color:'gray'})  ← DOES NOT WORK for cartoon!
    //
    // Instead, color must be embedded inside the cartoon spec itself.
    //
    var COLORS = {

        // Ab/Ag: route-provided antigen chains vs antibody/scaffold chains.
        'ab-ag': function() {
            if (!glv) return;

            if (currentStyle === 'surface') {
                glv.setStyle({not: visibleSelector()}, {});
                // Surface mode: set underlying atom colors (surface picks up atom colors)
                glv.setStyle(selectorForChains(AG_CHAINS), {color: AG_COLOR});
                if (AB_CHAINS.length) glv.setStyle(antibodySelector(), {color: AB_COLOR});
                return;
            }

            glv.setStyle({not: visibleSelector()}, {});
            // For non-surface styles: embed color INSIDE each style's spec
            // This is CRITICAL — 3Dmol ignores top-level "color" for cartoon/stick etc.
            applyByStyle(selectorForChains(AG_CHAINS), AG_COLOR);
            if (AB_CHAINS.length) applyByStyle(antibodySelector(), AB_COLOR);
        },

        // Chain: product display keeps the same two role colors and hides non-selected chains.
        'chain': function() {
            if (!glv) return;
            if (currentStyle === 'surface') {
                glv.setStyle({not: visibleSelector()}, {});
                glv.setStyle(selectorForChains(AG_CHAINS), {color: AG_COLOR});
                if (AB_CHAINS.length) glv.setStyle(antibodySelector(), {color: AB_COLOR});
                return;
            }
            glv.setStyle({not: visibleSelector()}, {});
            applyByStyle(selectorForChains(AG_CHAINS), AG_COLOR);
            if (AB_CHAINS.length) applyByStyle(antibodySelector(), AB_COLOR);
        },

        // Atom: color by atom type (CPK-like)
        'atom': function() {
            if (!glv) return;
            if (currentStyle === 'surface') {
                glv.setStyle({}, {});
                return;
            }
            switch(currentStyle){
                case 'cartoon': glv.setStyle({}, {cartoon:{colorscheme:'atomType'}}); break;
                case 'interface': glv.setStyle({}, {cartoon:{colorscheme:'atomType'}}); break;
                case 'sphere':  glv.setStyle({}, {sphere:{scale:0.35, colorscheme:'atomType'}}); break;
                case 'line':    glv.setStyle({}, {line:{colorscheme:'atomType'}}); break;
                case 'cross':   glv.setStyle({}, {cross:{colorscheme:'atomType'}}); break;
                default:        glv.setStyle({}, {cartoon:{colorscheme:'atomType'}});
            }
        }
    };

    // ════ Helpers ════
    function _getBaseSpec(styleName) {
        switch(styleName){
            case 'cartoon': return {cartoon:{}};
            case 'interface': return {cartoon:{}};
            case 'sphere':  return {sphere:{scale:0.35}};
            case 'line':    return {line:{}};
            case 'cross':   return {cross:{}};
            default:        return {cartoon:{}};
        }
    }

    function _merge(a, b) {
        var r = {};
        for(var k in a) r[k] = typeof a[k]==='object' && !Array.isArray(a[k]) ? _merge(a[k],{}) : a[k];
        for(var k in b) {
            if(typeof b[k]==='object' && !Array.isArray(b[k]) && typeof r[k]==='object'){
                r[k] = _merge(r[k],b[k]);
            } else {
                r[k] = b[k];
            }
        }
        return r;
    }

    // ════ INIT ════
    window.__vfInit = function init() {
        if (typeof $3Dmol === 'undefined') return;

        var container = document.getElementById('vc');
        var ldEl = container.querySelector('.ld');
        glv = $3Dmol.createViewer(container, {backgroundColor:'#0D1117'});
        if (!glv) { ldEl.textContent='GL fail'; return; }

        document.title = decodeURIComponent(params.get('title')||'') || 'Molecule';
        renderRoleLegend();

        // Style buttons
        Object.keys(STYLES).forEach(function(n){
            var b=document.createElement('button');
            b.className='btn'+(n===currentStyle?' active':'');
            b.textContent=n.charAt(0).toUpperCase()+n.slice(1);
            b.dataset.v=n;
            b.onclick=function(){doStyle(n);};
            document.getElementById('sBtns').appendChild(b);
        });

        // Color buttons
        ['ab-ag','chain','atom'].forEach(function(n){
            var b=document.createElement('button');
            b.className='btn'+(n===currentColor?' active':'');
            b.textContent=n==='ab-ag'?'\u{1F7E8} Ab / Ag'
                     :n==='chain'?'\u{1F441} Role'
                     :'\u{1F308} Atom';
            b.dataset.v=n;
            b.onclick=function(){doColor(n);};
            document.getElementById('cBtns').appendChild(b);
        });

        // Action buttons
        renderModelOriginBadge();
        renderAutoSpinBadge();
        ['Spin','Reset','PNG'].forEach(function(n){
            var b=document.createElement('button');b.className='act';b.textContent=n;
            if(n==='Spin')b.id='spinB';
            b.onclick=function(){if(n==='Spin')doSpin();else if(n==='Reset')doReset();else doPNG();};
            document.getElementById('acts').appendChild(b);
        });

        load(pdbUrl, ldEl);

        window.addEventListener('resize',function(){try{glv.resize();}catch(e){}});
    }; // end __vfInit

    // ════ LOAD ════
    function load(url,ldEl){
        if(!url){if(ldEl)ldEl.textContent='No URL';return;}
        var loadStarted = performance.now();
        var fetchFinished = loadStarted;
        console.log('[VF] load '+url);
        fetch(url).then(function(r){
            if(!r.ok)throw new Error(r.status);
            return r.text();
        }).then(function(txt){
            fetchFinished = performance.now();
            console.log('[VF] got '+txt.length+' chars');
            // Validate actual coordinate records (lines starting with ATOM/HETATM),
            // NOT just the word appearing in REMARK comments — a header-only payload
            // with no atoms makes 3Dmol crash on render.
            if(!/^(?:ATOM  |HETATM)/m.test(txt)) throw new Error('invalid PDB payload');
            glv.addModel(txt,'pdb');

            // Remove water molecules (resname HOH/WAT) and杂原子 for cleaner view
            try { glv.remove({or:[{resn:'HOH'},{resn:'WAT'}]}); } catch(e){}

            try {
                apply();
                applyViewerPose();
            } catch(renderErr) {
                // 3Dmol can throw on degenerate/empty models — surface the error
                // instead of leaving the viewer silently broken.
                console.error('[VF] render err:', renderErr);
                throw renderErr;
            }
            setTimeout(center,200);setTimeout(center,700);
            if(ldEl){ldEl.style.display='none';}
            _loaded=true;
            if(AUTO_SPIN)setSpinState(true);
            window.parent.postMessage({source:'viewer-full',type:'ready',data:{
                fetchMs: Math.round(fetchFinished-loadStarted),
                parseRenderMs: Math.round(performance.now()-fetchFinished),
                totalMs: Math.round(performance.now()-loadStarted)
            }},'*');
        }).catch(function(err){
            console.error('[VF] fetch err:',err);
            showLoadError(ldEl, err);
        });
    }

    function applyViewerPose(){
        if(!glv)return;
        try{
            glv.zoomTo();
            glv.rotate(24 + (POSE_SEED * 37 % 170), 'y');
            glv.rotate(-42 + (POSE_SEED * 19 % 86), 'x');
            glv.rotate(-18 + (POSE_SEED * 11 % 42), 'z');
            glv.zoom(0.94 + ((POSE_SEED % 7) * 0.025));
            glv.render();
        }catch(e){console.warn('[VF] pose err:',e);}
    }
    function showLoadError(ldEl, err) {
        console.error('[VF] load error:', err);
        if(ldEl){
            ldEl.textContent='Structure load failed';
            ldEl.style.color='#FCA5A5';
            ldEl.style.display='block';
        }
        window.parent.postMessage({source:'viewer-full',type:'error',data:{message:String(err&&err.message||err||'load failed')}},'*');
    }

    // ════ CORE APPLY ════
    function apply(){
        if(!glv)return;
        console.log('[VF] APPLY style='+currentStyle+' color='+currentColor);

        try{
            glv.removeAllSurfaces();

            glv.setStyle({}, {});

            if(currentStyle==='surface'){
                doSurface();
            }else if(currentStyle==='interface'){
                doInterfaceDetail();
            }else{
                var cs=COLORS[currentColor];
                if(cs)cs();
                else{ /* fallback */ }
            }
        }catch(e){console.warn('[VF] apply err:',e);}

        render();
    }

    function doSurface(){
        // Step 1: Remove old surfaces
        glv.removeAllSurfaces();

        // Step 2: Hide internal skeleton (surface covers everything)
        glv.setStyle(visibleSelector(), {line:{linewidth:0.5, opacity:0.03}});
        glv.setStyle({not: visibleSelector()}, {});

        var stype = null;
        try { stype = $3Dmol.SurfaceType.MS; } catch(e) {}
        if (!stype) try { stype = $3Dmol.SurfaceType.VDW; } catch(e) {}

        if (!stype) {
            console.warn('[VF] no SurfaceType available');
            var cs = COLORS[currentColor]; if(cs)cs();
            render(); return;
        }

        // Step 3: Apply route-provided antigen/antibody surfaces.
        try {
            glv.addSurface(stype, {
                opacity: 0.88,
                color: AG_COLOR
            }, selectorForChains(AG_CHAINS), {});
        } catch(e) {
            console.warn('[VF] surface antigen err:', e);
        }

        try {
            if (AB_CHAINS.length) {
                glv.addSurface(stype, {
                    opacity: 0.88,
                    color: AB_COLOR
                }, antibodySelector(), {});
            }
        } catch(e) {
            console.warn('[VF] surface antibody err:', e);
        }

        // If color scheme is chain or atom, also apply for consistency
        if (currentColor === 'chain') {
            // For chain mode, we can't easily do multi-color surfaces,
            // so keep the ab-ag split as best approximation
        }
    }

    function doInterfaceDetail(){
        if (!INTERFACE_DETAIL_ENABLED) {
            currentStyle = 'cartoon';
            var fallbackColors = COLORS[currentColor];
            if (fallbackColors) fallbackColors();
            return;
        }
        glv.removeAllSurfaces();
        applyByStyle(selectorForChains(AG_CHAINS), AG_COLOR);
        if (!AB_CHAINS.length) {
            glv.setStyle({not: visibleSelector()}, {});
            return;
        }
        applyByStyle(antibodySelector(), AB_COLOR);
        glv.setStyle({not: visibleSelector()}, {});

        var agSelector = selectorForChains(AG_CHAINS);
        var abSelector = antibodySelector();
        try {
            glv.setStyle({and:[agSelector, {within:{distance:5, sel:abSelector}}]}, {
                cartoon:{color:AG_COLOR},
                stick:{radius:0.14, color:AG_COLOR}
            });
            glv.setStyle({and:[abSelector, {within:{distance:5, sel:agSelector}}]}, {
                cartoon:{color:AB_COLOR},
                stick:{radius:0.14, color:AB_COLOR}
            });
        } catch(e) {
            console.warn('[VF] interface detail err:', e);
            applyByStyle(selectorForChains(AG_CHAINS), AG_COLOR);
            if (AB_CHAINS.length) applyByStyle(antibodySelector(), AB_COLOR);
        }
    }

    function render(){
        if(!glv)return;
        glv.render();
        setTimeout(function(){try{glv.zoomTo();glv.render();}catch(e){}},180);
    }
    function center(){try{glv.zoomTo();glv.render();}catch(e){}}

    function setCompactMode(compact, options) {
        options = options || {};
        COMPACT_MODE = !!compact;
        document.body.classList.toggle('compact-viewer', COMPACT_MODE);
        if (!COMPACT_MODE && options.autoSpin) {
            AUTO_SPIN = true;
            renderAutoSpinBadge();
            setSpinState(true);
        } else if (COMPACT_MODE) {
            setSpinState(false);
        }
        setTimeout(function(){
            try{if(glv){glv.resize();glv.zoomTo();glv.render();}}catch(e){}
        }, 40);
    }

    // ════ PUBLIC ACTIONS ════
    function doStyle(s){
        currentStyle=normalizeStyle(s);
        uiSync('style',currentStyle);
        if(_loaded)apply();
    }

    function doColor(c){
        currentColor=c;
        uiSync('color',c);
        if(_loaded)apply();
    }

    function uiSync(type,val){
        var p=type==='style'?document.getElementById('sBtns'):document.getElementById('cBtns');
        p.querySelectorAll('.btn').forEach(function(b){b.classList.toggle('active',b.dataset.v===val);});
    }

    function setSpinState(next){
        isSpinning=!!next;if(glv)glv.spin(isSpinning);
        var sb=document.getElementById('spinB');if(sb)sb.classList.toggle('active',isSpinning);
    }
    function doSpin(){
        setSpinState(!isSpinning);
    }

        }catch(e){console.error('[VF] png err:',e);}
    }

    // ════ POSTMESSAGE ════
    window.addEventListener('message',function(e){
        if(!e.data||e.data.source!=='zoonoab-gallery')return;
        var d=e.data;
        switch(d.type){
            case 'setStyle':doStyle(d.data.name);break;
            case 'setColor':doColor(d.data.mode);break;
            case 'resetView':doReset();break;
            case 'toggleSpin':
            case 'setSpin':
                setSpinState(d.data.spin!==false);
                break;
            case 'setCompact':
                setCompactMode(d.data.compact!==false,d.data);

            case 'exportImage':doPNG();break;
        }
    });

})();
