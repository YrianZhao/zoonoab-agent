<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Mol Thumb</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0D1117}
#c{width:100%;height:100%;position:relative}canvas{width:100%!important;height:100%!important;display:block;outline:none}
.ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#a5b4fc;font-size:12px;font-family:-apple-system,sans-serif;pointer-events:none}</style>
<body>
<div id="c"><div class="ld">Loading...</div></div>

<!-- LOCAL 3Dmol (no CDN dependency) -->
<script src="/lib/3Dmol-min.js"></script>
<script>
(function(){
    // ══════ CDN Fallback chain ══════
    var FALLBACKS = [
        'https://unpkg.com/3dmol@2.1.1/build/3Dmol-noui.min.js',
        'https://cdn.jsdelivr.net/npm/3dmol@2.1.1/build/3Dmol-noui.min.js'
    ];
    window.__3dmol_err = function(n) {
        if (n < FALLBACKS.length) {
            var s = document.createElement('script');
            s.src = FALLBACKS[n];
            s.onload = function() { window.__3dmol_ok = 1; init(); };
            s.onerror = function() { window.__3dmol_err(n+1); };
            document.head.appendChild(s);
        } else {
            document.querySelector('.ld').textContent = 'CDN failed';
        }
    };

    // ══════ Init ══════
    function init() {
        if (typeof $3Dmol === 'undefined') return;
        var params = new URLSearchParams(location.search);
        var pdbUrl = params.get('pdb') || '';
        var cA = params.get('chainA') || '#9CA3AF';
        var cB = params.get('chainB') || '#60A5FA';
        var poseSeed = parseInt(params.get('poseSeed') || '0', 10) || 0;
        function parseChains(value, fallback) {
            var arr = String(value || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
            return arr.length ? arr : fallback;
        }
        var antigenChains = parseChains(params.get('antigenChains'), ['A']);
        var antibodyChains = parseChains(params.get('antibodyChains'), ['B']);
        var visibleChains = antigenChains.concat(antibodyChains).filter(function(ch, idx, arr) {
            return ch && arr.indexOf(ch) === idx;
        });

        var container = document.getElementById('c');
        var ld = container.querySelector('.ld');
        var glv = $3Dmol.createViewer(container, { backgroundColor: '#0D1117' });
        if (!glv) { ld.textContent = 'GL fail'; return; }

        if (!pdbUrl) { ld.textContent = 'No URL'; return; }

        function applyChainColors(m) {
            var chains = [];
            m.selectedAtoms({}).forEach(function(a){ if(chains.indexOf(a.chain)<0) chains.push(a.chain); });
            chains.sort();
            if (!visibleChains.length && chains.length) visibleChains = [chains[0]];
            var hiddenChains = [];
            chains.forEach(function(ch) {
                var isAntigen = antigenChains.indexOf(ch) >= 0;
                var isAntibody = antibodyChains.indexOf(ch) >= 0;
                if (isAntigen) {
                    glv.setStyle({chain:ch},{cartoon:{color: cA || '#FB923C'}});
                } else if (isAntibody || (visibleChains.length === 1 && visibleChains[0] === ch)) {
                    glv.setStyle({chain:ch},{cartoon:{color: cB || '#2DD4BF'}});
                } else {
                    hiddenChains.push(ch);
                    glv.setStyle({chain:ch}, {});
                }
            });
        }

        function applyViewerPose() {
            try{glv.zoomTo();}catch(e){}
            try{
                var y = 24 + (poseSeed * 37 % 170);
                var x = -42 + (poseSeed * 19 % 86);
                var z = -18 + (poseSeed * 11 % 42);
                var zoom = 0.94 + ((poseSeed % 7) * 0.025);
                glv.rotate(y, 'y');
                glv.rotate(x, 'x');
                glv.rotate(z, 'z');
                glv.zoom(zoom);
            }catch(e2){}
            try{glv.render();}catch(e3){}
        }

        // Load PDB via fetch → full control
        fetch(pdbUrl).then(function(r){return r.text();}).then(function(txt){
            var m = glv.addModel(txt, 'pdb');
            applyChainColors(m);
            applyViewerPose();
            if(ld)ld.style.display='none';
            window.parent.postMessage({source:'gallery-mol',type:'ready',data:{}},'*');
        }).catch(function(e){
            console.warn('[thumb] fetch err:',e,'→ trying download');
            $3Dmol.download(pdbUrl,{mimetype:'text/plain'},function(txt2){
                var m = glv.addModel(txt2,'pdb');
                applyChainColors(m);
                applyViewerPose();
                if(ld)ld.style.display='none';
                window.parent.postMessage({source:'gallery-mol',type:'ready',data:{}},'*');
            });
        });

        setTimeout(function(){if(ld&&ld.style.display!=='none'){ld.style.display='none';}},20000);

        window.addEventListener('message',function(e){
            if(e.data&&e.data.type==='ping') e.source.postMessage({source:'gallery-mol',type:'pong',data:{}},'*');
        });
    }

    // Start when $3Dmol is available
    if (typeof $3Dmol !== 'undefined') init();
    else { var t=setInterval(function(){if(typeof $3Dmol!=='undefined'){clearInterval(t);init();}},200); }
})();
</script>
</body>
</html>
