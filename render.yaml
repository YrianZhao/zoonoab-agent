services:
  - type: web
    name: zoonoab-agent
    runtime: node
    plan: pro
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    branch: codex/voice-assistant-demo-20260528
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.2
      - key: PORT
        value: 10000
      - key: VOICE_API_CONFIG_FILE
        value: /var/data/voice-api-config.json
      - key: VOICE_ASR_PROVIDER
        value: local
      - key: VOICE_ASR_BASE_URL
        value: http://127.0.0.1:8765/v1/audio/transcriptions
      - key: VOICE_TRANSCRIBE_MODEL
        value: paraformer-zh
      - key: LOCAL_ASR_AUTO_START
        value: "1"
      - key: LOCAL_ASR_BOOTSTRAP
        value: "1"
      - key: LOCAL_ASR_PRELOAD
        value: "1"
      - key: LOCAL_ASR_DEVICE
        value: cpu
      - key: LOCAL_ASR_VENV_DIR
        value: /var/data/local-asr-venv
      - key: LOCAL_ASR_CACHE_DIR
        value: /var/data/local-asr-cache
      - key: LOCAL_ASR_TORCH_INDEX_URL
        value: https://download.pytorch.org/whl/cpu
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      - key: MODELSCOPE_CACHE
        value: /var/data/local-asr-cache/modelscope
      - key: HF_HOME
        value: /var/data/local-asr-cache/huggingface
      - key: TORCH_HOME
        value: /var/data/local-asr-cache/torch
      - key: PIP_CACHE_DIR
        value: /var/data/local-asr-cache/pip
      - key: ASSISTANT_CHAT_BASE_URL
        value: https://api.siliconflow.cn/v1/chat/completions
      - key: ASSISTANT_CHAT_API_KEY
        sync: false
      - key: ASSISTANT_CHAT_MODEL
        value: Qwen/Qwen3-32B
    disk:
      name: zoonoab-runtime
      mountPath: /var/data
      sizeGB: 20
