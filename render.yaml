services:
  - type: web
    name: zoonoab-agent
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: NODE_ENV
        value: production
      - key: VOICE_ASR_PROVIDER
        value: deepseek
      - key: VOICE_TRANSCRIBE_MODEL
        value: deepseek-v4-flash
