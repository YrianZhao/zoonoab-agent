services:
  - type: web
    name: zoonoab-agent
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VOICE_ASR_PROVIDER
        value: openai
      - key: VOICE_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_API_KEY
        sync: false
