services:
  - type: web
    name: zoonoab-agent
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VOICE_ASR_PROVIDER
        value: deepseek
      - key: VOICE_TRANSCRIBE_MODEL
        value: deepseek-v4-flash
