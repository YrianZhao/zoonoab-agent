services:
  - type: web
    name: zoonoab-agent
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: NODE_ENV
        value: production
      - key: VOICE_ASR_PROVIDER
        value: deepseek
      - key: VOICE_TRANSCRIBE_MODEL
        value: FunAudioLLM/SenseVoiceSmall
      - key: VOICE_CHAT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_ASR_BASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: VOICE_CHAT_BASE_URL
        sync: false
      - key: VOICE_CHAT_API_KEY
        sync: false
